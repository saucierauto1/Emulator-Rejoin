   name: Build APK
   on:
     push:
       branches: [main]
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 17
         - uses: gradle/actions/setup-gradle@v4
           with:
             gradle-version: "8.7"
         - run: gradle assembleRelease
         - run: cp app/build/outputs/apk/release/*.apk NovaHopRejoin.apk
         - uses: actions/upload-artifact@v4
           with:
             name: NovaHopRejoin
             path: NovaHopRejoin.apk
         - uses: softprops/action-gh-release@v2
           with:
             tag_name: v1.0.${{ github.run_number }}
             name: NovaHop Rejoin v1.0.${{ github.run_number }}
             files: NovaHopRejoin.apk
